build:
  maxIssues: 0
  maxIssuesPercentage: 100
  weights:
    complexity: 2
    style: 1
    LongParameterList: 1

config:
  validation: true
  warningsAsErrors: true
  checkBuildUponDefaultConfig: true
  detectors:
    active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  NestedBlockDepth:
    active: true
    threshold: 4
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    threshold: 6

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
  VariableNaming:
    active: true
  ConstantNaming:
    active: true

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: [-1, 0, 1, 2]
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnumEntry: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedVariable:
    active: true
